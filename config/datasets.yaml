# Dataset Configuration

reference:
  name: "MesoInception-4 Training Data"
  features_path: "data/reference/train_features.npy"
  # Note: If generate_traffic.py didn't create labels, comment this out or ensure it exists
  # labels_path: "data/reference/train_labels.npy" 
  num_samples: 1800
  num_features: 16
  description: "Baseline from Meta-Learning Classifier training"

simulation_batches:
  - batch_id: "week1_healthy"
    features_path: "data/simulation/week1_features.npy" # Changed to match script
    num_samples: 1000
    expected_drift: "none"
    description: "Healthy traffic - no drift"
  
  - batch_id: "week3_high_drift"
    features_path: "data/simulation/week3_features.npy" # Changed to match script
    num_samples: 1000
    expected_drift: "high"
    description: "New deepfake type - high drift"